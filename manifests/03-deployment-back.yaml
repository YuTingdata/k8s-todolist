# ============================================================
# Etape 3 - Deployment backend
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # DONE : combien de replicas pour le backend ? (cf. enonce)
  replicas: 1
  selector:
    matchLabels:
      # DONE : selector — doit matcher le label des pods du template
      app: backend
  template:
    metadata:
      labels:
        # DONE : label du pod — doit etre coherent avec le selector ci-dessus
        app: backend
    spec:
      containers:
        - name: backend
          image: stephanparichon/epsi-k8s-bff:1.0
          ports:
            - containerPort: 3000
              name: http
          # DONE : injecter la variable d'env ADMIN_TOKEN
          #        depuis le Secret "backend-secret", cle "admin-token"
          #        (utiliser la syntaxe env / valueFrom / secretKeyRef)
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: admin-token
          # DONE : ajouter une readinessProbe HTTP GET /health sur le port 3000
          #        - initialDelaySeconds : 3
          #        - periodSeconds : 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
